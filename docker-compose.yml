services:
  app-laravel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app # При смене имени все ломается!
    restart: unless-stopped
    volumes:
      - ./:/var/www/
    # environment:
    #   - DB_HOST=db
    #   - DB_DATABASE=laravel
    #   - DB_USERNAME=root
    #   - DB_PASSWORD=secret
    networks:
      - app-network
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: webserver
    restart: unless-stopped
    ports:
      - "8000:80"
      - "4430:443"
    volumes:
      - ./:/var/www/
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app-network
    depends_on:
      - app-laravel

  db:
    image: mysql:latest
    container_name: database
    restart: unless-stopped
    ports:
      - 8100:3306
    environment:
      MYSQL_DATABASE: laradock
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - app-network

volumes:
  dbdata:

networks:
  app-network:
    driver: bridge