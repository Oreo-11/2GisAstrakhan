<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея</title>

    <link rel="stylesheet" href="assets/css/fonts.css">
    <link rel="stylesheet" href="assets/css/globals.css">
    <link rel="stylesheet" href="assets/css/alt-header.css">
    <link rel="stylesheet" href="assets/css/gallery-page.css">
</head>
<body>
    <img class="background__image" src="assets/images/gallery-background.png" alt="">
    <header class="header jost">
        <div class="header__container">
            <img src="assets/images/header-logo.svg" alt="Логотип drive" class="header__logo">
            <nav class="header__nav">
                <ul class="nav__list">
                    <li class="nav__item">
                        <a href="#" class="nav__link">
                            Галерея
                        </a>
                    </li>
                    <li class="nav__item">
                        <a href="#" class="nav__link">
                            Карта
                        </a>
                    </li>
                    <li class="nav__item">
                        <a href="#" class="nav__link">
                            История города
                        </a>
                    </li>
                    <li class="nav__item">
                        <a href="#" class="nav__link">
                            Каталог
                        </a>
                    </li>
                    <li class="nav__item">
                        <a href="#" class="nav__link">
                            Страница мест
                        </a>
                    </li>
                </ul>
    
            </nav>
            <img src="assets/images/avatar.png" alt="Аватар профиля" class="header__profile">
        </div>
    </header>

    <main class="gallery">
        <div class="gallery__container">
            <h1 class="gallery__title">Взгляни на наш город!</h1>
            <div class="gallery__content">
                <div class="gallery__image" id="img-1">
                    <div class="gallery__review">
                        <div class="gallery__review-avatar">
                            <img src="assets/images/avatar.png" alt="avatar" width="48" class="avatar">
                            <span class="avatar__name bellota-text">Автор</span>
                        </div>
                        <div class="gallery__review-description">
                            <span class="description__title bellota-text-bold">
                                Анастасия
                            </span>
                            <p class="description__content bellota-text">
                                Это бар на улице такой-то, мне очень понравилось
                            </p>
                        </div>
                    </div>
                </div>
                <div class="gallery__image" id="img-2"></div>
                <div class="gallery__image" id="img-3"></div>
                <div class="gallery__image" id="img-4"></div>
                <div class="gallery__image" id="img-5"></div>
                <div class="gallery__image" id="img-6"></div>
                <div class="gallery__image" id="img-7"></div>
                <div class="gallery__image" id="img-8"></div>
                <div class="gallery__image" id="img-9"></div>
                <div class="gallery__image" id="img-10"></div>
                <div class="gallery__image" id="img-11"></div>
                <div class="gallery__image" id="img-12"></div>
                <div class="gallery__image" id="img-13"></div>
                <div class="gallery__image" id="img-14"></div>
            </div>
        </div>
    </main>
</body>
</html>
