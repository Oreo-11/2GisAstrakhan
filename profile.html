<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="assets/css/fonts.css">
    <link rel="stylesheet" href="assets/css/globals.css">
    <link rel="stylesheet" href="assets/css/header-search.css">
    <link rel="stylesheet" href="assets/css/alt-header-search.css">
    <link rel="stylesheet" href="assets/css/profile.css">
</head>
<body>
    <header class="header__search jost">
        <div class="header__search__container">
            <img src="assets/images/header-logo.svg" alt="Логотип drive" class="header__search__container__logo">
            <nav class="header__search__container__nav">
                <ul class="header__search__container__nav__list">
                    <li class="header__search__container__nav__list__nav__item">
                        <a href="#" class="header__search__container__nav__list__nav__item__link">
                            Галерея
                        </a>
                    </li>
                    <li class="header__search__container__nav__list__nav__item">
                        <a href="#" class="header__search__container__nav__list__nav__item__link">
                            Карта
                        </a>
                    </li>
                    <li class="header__search__container__nav__list__nav__item">
                        <a href="#" class="header__search__container__nav__list__nav__item__link">
                            История города
                        </a>
                    </li>
                    <li class="header__search__container__nav__list__nav__item">
                        <a href="#" class="header__search__container__nav__list__nav__item__link">
                            Каталог
                        </a>
                    </li>
                    <li class="header__search__container__nav__list__nav__item">
                        <a href="#" class="header__search__container__nav__list__nav__item__link">
                            Страница мест
                        </a>
                    </li>
                </ul>
    
            </nav>
            <img src="assets/images/avatar.png" alt="Аватар профиля" class="header__search__container__profile">
        </div>
        <div class="header__search__block">
            <input type="text" class="header__search__block__input">
        </div>
    </header>
    <div class="profile__main">
        <div class="profile__main__user">
            <div class="profile__main__user__info">
                <div class="profile__main__user__info__img">
                    <img src="assets/images/image (5).png" alt="">
                </div>
                <div class="profile__main__user__info__text">
                    <h1>Анастасия Павлова</h1>
                    <p class="profile__main__user__info__text__smallP">Был(-а) в сети 21.08.2025</p>
                    <p class="profile__main__user__info__text__p">Возраст: 28</p>
                    <p class="profile__main__user__info__text__p__last">Пол: Жен.</p>
                    <div class="profile__main__user__info__text__buttonBlock">
                        <button class="profile__main__user__info__text__buttonBlock__button">Редактировать профиль</button>
                        <button class="profile__main__user__info__text__buttonBlock__button">Удалить аккаунт</button>
                    </div>
                </div>
            </div>
            <div class="profile__main__user__fon">
                <img src="assets/images/fbcfd8ae07dc914cb195dc88c4d8aba2-Photoroom 1 (1).png" alt="">
            </div>
        </div>
        <div class="profile__main__exit">
            <button class="profile__main__exit__button">Выход</button>
        </div>
        <div class="profile__main__allInfo">
            <div class="profile__main__allInfo__fon">
                <img src="assets/images/e4e0e9e8f705eb5b4ced378da253b23f-Photoroom 1.png" alt="">
            </div>
            <div class="profile__main__allInfo__block">
                <div class="profile__main__allInfo__block__title">
                    <div class="profile__main__allInfo__block__title__block">
                        <p>Избранное</p>
                    </div>
                    <div class="profile__main__allInfo__block__title__block">
                        <p>Отзывы</p>
                    </div>
                    <div class="profile__main__allInfo__block__title__block">
                        <p>Фотографии</p>
                    </div>
                    <div class="profile__main__allInfo__block__title__block">
                        <p>Мои места</p>
                    </div>
                </div>
                <div class="profile__main__allInfo__block__main">
                    <div class="profile__main__allInfo__block__main__favorite">
                        <div class="profile__main__allInfo__block__main__favorite__line">
                            <div class="profile__main__allInfo__block__main__favorite__line__block">
                                <div class="profile__main__allInfo__block__main__favorite__line__block__img">
                                    <img class="profile__main__allInfo__block__main__favorite__line__block__img" src="assets/images/Rectangle 225.png" alt="">
                                    <a href="#" class="bar__like">                                       
                                        <svg width="23" height="21" viewBox="0 0 23 21" fill="none" xmlns="http://www.w3.org/2000/svg">
                                            <path d="M11.7637 3.2835C7.89259 -2.80978 0.0576172 0.509645 0.0576172 7.14726C0.0576172 12.1316 10.7989 19.9285 11.7637 20.9423C12.7351 19.9285 22.9422 12.1316 22.9422 7.14726C22.9422 0.559967 15.642 -2.80978 11.7637 3.2835Z" fill="#5871FC"/>
                                        </svg>
                                    </a>
                                </div>
                                <div class="profile__main__allInfo__block__main__favorite__line__block__text">
                                    <h1></h1>
                                    <p></p>
                                    <p></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
