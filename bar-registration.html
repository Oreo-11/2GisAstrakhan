<link rel="stylesheet" href="./assets/css/fonts.css">
<link rel="stylesheet" href="./assets/css/globals.css">
<link rel="stylesheet" href="./assets/css/bar-registration.css">

<div class="registration__container">
    <form class="registration__form bellota-text" action="">
        <h4 class="registration__title bellota-text-bold" id="person-info">Информация об аккаунте</h4>

        <div class="registration__input-box" id="input__surname">
            <label class="registration__label" for="surname">Фамилия владельца*</label>
            <div class="registration__input-border">
                <input class="registration__input" type="text" id="surname">
            </div>
        </div>

        <div class="registration__input-box" id="input__name">
            <label class="registration__label" for="name">Имя владельца*</label>
            <div class="registration__input-border">
                <input class="registration__input" type="text" id="name">
            </div>
        </div>

        <div class="registration__input-box" id="input__patronymic">
            <label class="registration__label" for="patronymic">Отчество владельца*</label>
            <div class="registration__input-border">
                <input class="registration__input" type="text" id="patronymic">
            </div>
        </div>

        <div class="registration__input-box" id="input__mail">
            <label class="registration__label" for="mail">Почта связи с заведением*</label>
            <div class="registration__input-border">
                <input class="registration__input" type="email" id="mail">
            </div>
        </div>

        <div class="registration__input-box" id="input__password">
            <label class="registration__label" for="password">Пароль*</label>
            <div class="registration__input-border">
                <input class="registration__input" type="text" id="password">
            </div>
        </div>

        <div class="registration__input-box" id="input__password-repeat">
            <label class="registration__label" for="password-repeat">Повторите пароль*</label>
            <div class="registration__input-border">
                <input class="registration__input" type="text" id="password-repeat">
            </div>
        </div>

        
        <h4 class="registration__title bellota-text-bold" id="bar-info">Информация о заведении</h4>

        <div class="registration__input-box" id="input__bar-name">
            <label class="registration__label" for="bar-name">Наименование заведения*</label>
            <div class="registration__input-border">
                <input class="registration__input" type="text" id="bar-name">
            </div>
        </div>

        <div class="registration__input-box" id="input__phone">
            <label class="registration__label" for="phone">Контактный телефон*</label>
            <div class="registration__input-border">
                <input class="registration__input" type="text" id="phone">
            </div>
        </div>

        <div class="registration__input-box" id="input__address">
            <label class="registration__label" for="address">Адрес*</label>
            <div class="registration__input-border">
                <input class="registration__input" type="text" id="address">
            </div>
        </div>

        <div class="registration__input-box" id="input__INN">
            <label class="registration__label" for="INN">ИНН*</label>
            <div class="registration__input-border">
                <input class="registration__input" type="text" id="INN">
            </div>
        </div>

        <div class="registration__input-box" id="input__KPP">
            <label class="registration__label" for="KPP">КПП*</label>
            <div class="registration__input-border">
                <input class="registration__input" type="text" id="KPP">
            </div>
        </div>

        <div class="registration__input-box" id="input__OGRN">
            <label class="registration__label" for="OGRN">ОГРН*</label>
            <div class="registration__input-border">
                <input class="registration__input" type="text" id="OGRN">
            </div>
        </div>
        
        <div class="registration__input-box worktime__box" id="input__worktime">
            <div class="registration__input-border worktime__border">
                <input class="worktime__place bellota-text" type="time" name="" id="time__from">
            </div>
            <img src="./assets/images/worktime-dash.svg" alt="" class="worktime__dash">
            <div class="registration__input-border worktime__border">
                <input class="worktime__place bellota-text" type="time" name="" id="time__to">
            </div>
            <span class="worktime__title bellota__text">Время работы*</span>
        </div>


        <div class="registration__input-box" id="input__bar-image">
            <span class="registration__label">Изображение*</span>
            <label id="bar-image__label" for="bar-image">
                <div class="bar-image__upload">
                    <div class="bar-image__icon">
                        <img src="./assets/images/upload-arrow.svg" alt="">
                    </div>
                    <span class="bar-image__title jost">Загрузить файл</span>
                </div>
            </label>
            <input type="file" accept="image/*" id="bar-image" hidden>
        </div>

        <div class="registration__input-box" id="input__telegram">
            <label class="registration__label" for="telegram">Telegram</label>
            <div class="registration__input-border input__contact-border">
                <input class="registration__input input__contact" type="text" id="telegram">
            </div>
        </div>

        <div class="registration__input-box" id="input__whatsapp">
            <label class="registration__label" for="whatsapp">Whats App</label>
            <div class="registration__input-border input__contact-border">
                <input class="registration__input input__contact" type="text" id="whatsapp">
            </div>
        </div>

        <div class="registration__input-box" id="input__vk">
            <label class="registration__label" for="vk">VK</label>
            <div class="registration__input-border input__contact-border">
                <input class="registration__input input__contact" type="text" id="vk">
            </div>
        </div>

        <div class="registration__input-box" id="input__about">
            <label class="registration__label" for="about">Описание заведения</label>
            <div class="registration__input-border input__area-border">
                <textarea class="registration__input input__area" id="about"></textarea>
            </div>
        </div>

        <input class="bellota-text-bold" type="submit" value="Войти" id="input__submit">
    </form>
</div>
